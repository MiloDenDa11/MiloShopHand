name: Milo quality checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      PAYMENT_PROVIDER: mock
      SHIPPING_PROVIDER: mock
      EMAIL_PROVIDER: file
      TRY_ON_ENABLED: 'false'
      OPENAI_API_KEY: ''
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      CLOUDINARY_API_KEY: ''
      CLOUDINARY_API_SECRET: ''
      SMTP_PASSWORD: ''
      SKIP_BREACH_CHECK: 'true'
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Ephemeral test-only signing keys
        run: node -e "const f=require('fs'),c=require('crypto');f.appendFileSync(process.env.GITHUB_ENV,'SESSION_SECRET='+c.randomBytes(32).toString('hex')+'\nMFA_ENCRYPTION_KEY='+c.randomBytes(32).toString('hex')+'\n')"
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:shopping-growth
      - run: npm run test:fulfillment
      - run: npm run test:auth-upgrade
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
