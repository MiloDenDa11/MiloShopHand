limit_req_zone $binary_remote_addr zone=milo_edge:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=milo_connections:10m;
server_tokens off;
server {
 listen 80;
 server_name _;
 client_max_body_size 6m;
 client_header_timeout 10s;
 client_body_timeout 15s;
 send_timeout 30s;
 keepalive_timeout 15s;
 limit_conn milo_connections 30;
 limit_req zone=milo_edge burst=60 nodelay;
 limit_req_status 429;
 autoindex off;
 add_header X-Content-Type-Options nosniff always;
 location ~ /\.(?!well-known/) { deny all; }
 location = /api/v1/me/events { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; proxy_buffering off; proxy_cache off; proxy_read_timeout 75s; }
 # OAuth codes must not enter access logs or same-origin Referer headers.
 location = /api/v1/auth/google/callback { access_log off; proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 30s; }
 # The try-on photo accepts 8 MB plus multipart framing; other uploads keep 6 MB.
 location = /api/v1/try-on/jobs { client_max_body_size 9m; proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 30s; }
 location /api/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 30s; }
 location /uploads/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
 location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
