server {
 listen 80;
 server_name _;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 30s; }
 location /uploads/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
 location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
