# Deployment template; replace shop.example.invalid and supply real certificates.
# Keep API/web ports private; this ingress is the only public listener.
limit_req_zone $binary_remote_addr zone=milo_prod_edge:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=milo_prod_connections:10m;
server_tokens off;

server {
  listen 80;
  server_name shop.example.invalid;
  return 308 https://shop.example.invalid$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name shop.example.invalid;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:milo_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  client_max_body_size 6m;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 15s;
  limit_conn milo_prod_connections 30;
  limit_req zone=milo_prod_edge burst=60 nodelay;
  limit_req_status 429;
  autoindex off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
  location ~ /\.(?!well-known/) { deny all; }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host shop.example.invalid;
  proxy_set_header X-Forwarded-Host shop.example.invalid;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Forwarded "";
  proxy_read_timeout 30s;
  proxy_connect_timeout 5s;
  location /api/ { proxy_pass http://api:4000; }
  location /uploads/ { proxy_pass http://api:4000; }
  location / { proxy_pass http://web:3000; }
}
