name: miloshophand
services:
 postgres:
  image: postgres:18.6-alpine
  restart: unless-stopped
  environment:
   POSTGRES_USER: milo
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milo_local}
   POSTGRES_DB: milo
   POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
  ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
  # PostgreSQL 18 images keep PGDATA below this parent mount.
  # A separate volume avoids opening an existing PostgreSQL 17 data directory.
  volumes: ["postgres18_data:/var/lib/postgresql"]
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U milo -d milo"]
   interval: 5s
   timeout: 5s
   start_period: 10s
   retries: 15
 redis:
  image: redis:7.4.11-alpine
  restart: unless-stopped
  command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
  ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
  volumes: ["redis_data:/data"]
  healthcheck:
   test: ["CMD", "redis-cli", "ping"]
   interval: 5s
   timeout: 3s
   retries: 15
 mailpit:
  image: axllent/mailpit:v1.27.10
  ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
 migrate:
  working_dir: /app
  build: {context: .., dockerfile: infra/Dockerfile.api}
  env_file: ../.env
  environment: {DATABASE_URL: "postgresql://milo:${POSTGRES_PASSWORD:-milo_local}@postgres:5432/milo?schema=public"}
  command: sh -c "npm run db:migrate && npm run db:seed"
  depends_on: {postgres: {condition: service_healthy}}
 api:
  build: {context: .., dockerfile: infra/Dockerfile.api}
  env_file: ../.env
  environment:
   DATABASE_URL: postgresql://milo:${POSTGRES_PASSWORD:-milo_local}@postgres:5432/milo?schema=public
   REDIS_URL: redis://redis:6379
   SMTP_HOST: mailpit
   EMAIL_PROVIDER: smtp
   UPLOAD_DIR: /app/uploads
   RETURN_UPLOAD_DIR: /app/return-uploads
   NODE_ENV: development
  working_dir: /app/apps/api
  command: node dist/apps/api/src/main.js
  volumes: ["uploads:/app/uploads", "return_uploads:/app/return-uploads"]
  depends_on: {migrate: {condition: service_completed_successfully},redis: {condition: service_healthy}}
 worker:
  build: {context: .., dockerfile: infra/Dockerfile.api}
  env_file: ../.env
  environment:
   DATABASE_URL: postgresql://milo:${POSTGRES_PASSWORD:-milo_local}@postgres:5432/milo?schema=public
   REDIS_URL: redis://redis:6379
   SMTP_HOST: mailpit
   EMAIL_PROVIDER: smtp
   NODE_ENV: development
  working_dir: /app/apps/worker
  command: node ../api/dist/apps/worker/src/main.js
  depends_on: {migrate: {condition: service_completed_successfully},redis: {condition: service_healthy}}
 web:
  build:
   context: ..
   dockerfile: infra/Dockerfile.web
   args:
    NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
    NEXT_PUBLIC_GOOGLE_MAPS_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_ID:-}
    BRAND_NAME: ${BRAND_NAME:-MILOSHOPHAND}
    S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  environment: {API_INTERNAL_URL: "http://api:4000"}
  depends_on: [api]
 proxy:
  image: nginx:1.28.0-alpine
  ports: ["3000:80"]
  volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
  depends_on: [api,web]
volumes:
 postgres18_data:
 redis_data:
 uploads:
 return_uploads:
